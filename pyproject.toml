[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krakenlcd"
version = "0.2.0b1"
description = "Userspace driver and GUI for the NZXT Kraken Z LCD on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["nzxt", "kraken", "lcd", "hidraw", "usb", "hardware"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

# The protocol layer deliberately has no dependencies: talking to the device
# is pure stdlib.  Pillow comes in for rasterising text and encoding images,
# resvg (a Rust SVG renderer, prebuilt wheels for every Linux architecture)
# for drawing live designs, and PyQt6 only for the optional GUI.
dependencies = ["pillow>=9.1", "resvg-py>=0.5,<0.6"]

[project.optional-dependencies]
gui = ["PyQt6>=6.4"]

[project.scripts]
krakenlcd = "krakenlcd.cli:main"

[project.gui-scripts]
krakenlcd-gui = "krakenlcd.gui:main"

[project.urls]
Homepage = "https://github.com/ossini/krakenlcd"
Issues = "https://github.com/ossini/krakenlcd/issues"

[tool.setuptools]
packages = ["krakenlcd"]

# The built-in designs, and the fonts they are set in, so they look the same
# on a machine that has none of them installed.  The fonts are all SIL Open
# Font License; the licence texts sit next to them.
[tool.setuptools.package-data]
krakenlcd = ["fonts/*.ttf", "fonts/*.txt",
             "designs/*/*.svg", "designs/*/*.png", "designs/*/*.jpg",
             "designs/*/*.ttf", "designs/*/*.otf", "designs/*/*.txt"]
