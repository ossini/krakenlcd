<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320"
     data-scale-min="20" data-scale-max="100"
     data-cool-color="#2fd4ff" data-warm-color="#ffc83d" data-hot-color="#ff3b30">
  <title>Simple</title>
  <desc>CPU temperature on a ring that turns from cool to hot, GPU and coolant below.</desc>
  <!--
    A starting point for your own design: "krakenlcd design new NAME" makes
    a copy of this file for you to change.  It is plain SVG, so open it in
    Inkscape, Figma, Illustrator or a text editor, or ask an AI for one.

    Everything between {{ and }} is filled in live, every couple of seconds:

      {{ cpu }}                        a sensor: cpu, gpu, liquid, cpu_load,
                                       gpu_load, ram, pump, fan, time, …
      {{ fmt(gpu, 1) }}                a number with one decimal
      {{ map(cpu, 20, 100, 0, 1) }}    rescaled: 20 °C gives 0, 100 °C gives 1
      {{ arc(cx, cy, r, from, to) }}   a circular arc, for a path's d="…";
                                       degrees, 0 is the top, clockwise
      {{ ramp(t, color1, color2, …) }} a colour along a list of them,
                                       t from 0 (the first) to 1 (the last)
      {{ 'red' if cpu > 80 else 'white' }}

    The data-… attributes on the <svg> element above are settings: each one
    is a value you can use in here (data-scale-min becomes scale_min), and
    can be changed in the GUI without touching this file.

    The display redraws whenever you save, so keep "krakenlcd dash NAME"
    running while you edit.  docs/DESIGNS.md has the whole list.
  -->

  <!-- The panel is round and 320 pixels across. -->
  <circle cx="160" cy="160" r="160" fill="#0b0d10"/>

  <!-- The ring: a dim track, and over it an arc up to the CPU temperature,
       coloured from cool-color through warm-color to hot-color. -->
  <path d="{{ arc(160, 160, 138, -135, 135) }}"
        fill="none" stroke="#1c2128" stroke-width="12" stroke-linecap="round"/>
  <path d="{{ arc(160, 160, 138, -135, map(cpu, scale_min, scale_max, -135, 135)) }}"
        fill="none" stroke-width="12" stroke-linecap="round"
        stroke="{{ ramp(map(cpu, scale_min, scale_max, 0, 1), cool_color, warm_color, hot_color) }}"/>

  <!-- The reading, with its label above. -->
  <text x="160" y="104" text-anchor="middle" font-family="JetBrains Mono"
        font-size="13" letter-spacing="4" fill="#7d8590">CPU</text>
  <text x="160" y="186" text-anchor="middle" font-family="Chakra Petch"
        font-weight="700" font-size="96" fill="#ffffff">{{ fmt(cpu) }}<tspan
        font-size="36" dy="-44" fill="#7d8590">°</tspan></text>

  <!-- Two smaller readings along the bottom. -->
  <g font-family="JetBrains Mono" text-anchor="middle">
    <text x="116" y="232" font-size="11" letter-spacing="2" fill="#7d8590">GPU</text>
    <text x="116" y="256" font-size="20" font-weight="700" fill="#ffffff">{{ fmt(gpu) }}°</text>
    <text x="204" y="232" font-size="11" letter-spacing="2" fill="#7d8590">LIQUID</text>
    <text x="204" y="256" font-size="20" font-weight="700" fill="#ffffff">{{ fmt(liquid) }}°</text>
  </g>
</svg>
