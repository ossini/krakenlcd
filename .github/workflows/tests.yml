name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the package
        run: python -m pip install .

      # Run from outside the checkout so the installed package is imported.
      # That is what proves the built-in designs and fonts made it into it.
      - name: Unit tests
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v

      - name: Command line, no cooler attached
        working-directory: ${{ runner.temp }}
        run: |
          krakenlcd --help > /dev/null
          krakenlcd --version | grep -F "$(python -c 'import krakenlcd; print(krakenlcd.__version__)')"
          krakenlcd sensors
          krakenlcd design list
          for name in swiss simple duo; do
            krakenlcd design preview "$name" --demo -o "$name.png"
          done
          krakenlcd dash --preview dash.png

      - name: Keep the previews
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: design-previews
          path: ${{ runner.temp }}/*.png

  gui:
    name: GUI (offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Libraries Qt needs even offscreen
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the package with the GUI
        run: python -m pip install '.[gui]'

      - name: GUI tests
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_gui.py' -v

  install-script:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than whatever the runner image ships: versions differ in
      # what they flag, and the image changes under us.
      - name: Shellcheck
        run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck install.sh scripts/*.sh

      - name: Install from the checkout, without udev or the service
        run: ./install.sh --no-gui --no-udev --no-service

      - name: The installed command works
        run: |
          ~/.local/bin/krakenlcd design list
          ~/.local/bin/krakenlcd design preview swiss --demo -o "$RUNNER_TEMP/swiss.png"

      - name: Uninstall
        run: |
          ~/.local/share/krakenlcd/src/install.sh --uninstall --no-udev
          test ! -e ~/.local/bin/krakenlcd
          test ! -e ~/.local/share/krakenlcd
